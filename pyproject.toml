[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "coolai-gate"
version = "0.2.0"
description = "A small policy gate for AI-agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Marcin Orocz"}]
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["pytest>=8.0,<10", "pytest-cov>=7,<8", "coverage>=7.10,<8"]
dev = ["ruff>=0.12,<1", "build>=1,<2"]
mcp = ["mcp>=1.28,<2"]

[project.urls]
Homepage = "https://github.com/marcinorocz/coolAI"
Issues = "https://github.com/marcinorocz/coolAI/issues"

[project.scripts]
coolai = "coolai.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["integration: real subprocess MCP transport tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
patch = ["subprocess"]
source = ["coolai"]
