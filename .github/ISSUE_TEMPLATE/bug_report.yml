name: Bug report
description: Report behaviour that is incorrect, unsafe, or unclear.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you. Do not include credentials, personal data, customer documents, or security exploits here. Use the Security tab for vulnerabilities."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behaviour and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide safe, synthetic steps or a small code sample.
      placeholder: "1. Run ...\n2. Evaluate ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: coolAI version or commit
      placeholder: "main / 0.1.0 / commit SHA"
    validations:
      required: true
